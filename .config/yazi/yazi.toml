[mgr]
show_hidden = false

[opener]
edit = [
	{ run = '$EDITOR %s', block = true,  for = "unix" },
]
open = [
	{ run = 'xdg-open %s', desc = "Open", for = "linux" },
	{ run = 'mimeopen --ask %s', block = true, desc = "Open Ask", for = "linux" },
]
reveal = [
	{ run = '''exiftool %s; echo "Press enter to exit"; read''', block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
	{ run = 'unar %s', desc = "Extract here", for = "unix" },
]
play = [
	{ run = 'mpv %s', orphan = true, for = "unix" },
	{ run = '''mediainfo %s; echo "Press enter to exit"; read''', block = true, desc = "Show media info", for = "unix" },
]
gimp = [
	{ run = 'gimp %s', desc = "Gimp", orphan = true, for = "unix" },
]
pdf = [
	{ run = 'zathura %s', desc = "PDF (zathura)", orphan = true, for = "unix" },
]

[open]
rules = [
	# { name = "*/", use = [ "edit", "open", "reveal" ] },

	{ mime = "text/html",  use = [ "open", "edit", "reveal" ] },
	{ mime = "text/csv",  use = [ "open", "edit", "reveal" ] },
	{ mime = "text/*",  use = [ "edit", "reveal" ] },
	{ mime = "image/*", use = [ "open", "gimp", "reveal" ] },
	{ mime = "video/*", use = [ "play", "reveal" ] },
	{ mime = "audio/*", use = [ "play", "reveal" ] },
	{ mime = "inode/x-empty", use = [ "edit", "reveal" ] },

	{ mime = "application/pdf", use = [ "pdf", "open", "reveal" ] },

	{ mime = "application/json", use = [ "edit", "reveal" ] },
	{ mime = "*/javascript",     use = [ "edit", "reveal" ] },

	{ mime = "application/zip",             use = [ "extract", "reveal" ] },
	{ mime = "application/gzip",            use = [ "extract", "reveal" ] },
	{ mime = "application/x-tar",           use = [ "extract", "reveal" ] },
	{ mime = "application/x-bzip",          use = [ "extract", "reveal" ] },
	{ mime = "application/x-bzip2",         use = [ "extract", "reveal" ] },
	{ mime = "application/x-7z-compressed", use = [ "extract", "reveal" ] },
	{ mime = "application/x-rar",           use = [ "extract", "reveal" ] },

	{ mime = "*", use = [ "open", "reveal" ] },
]

