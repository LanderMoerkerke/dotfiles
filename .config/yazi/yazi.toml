[plugin]
prepend_previewers = [
    # Rich text previews via piper (xsv/jut/dbview/sqlite3/glow)
    { url = "*.csv", run = 'piper -- xsv table -d "$(detect-delimiter "$1")" "$1"' },
    { url = "*.ipynb", run = 'piper -- jut "$1"' },
    { url = "*.dbf", run = 'piper -- dbview "$1"' },
    { url = "*.db", run = 'piper -- sqlite3 "$1" ".tables"' },
    { url = "*.sqlite", run = 'piper -- sqlite3 "$1" ".tables"' },
    { url = "*.sqlite3", run = 'piper -- sqlite3 "$1" ".tables"' },
    { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -s dark -w $w "$1"' },
    # Archives via ouch
    { mime = "application/zip", run = "ouch" },
    { mime = "application/gzip", run = "ouch" },
    { mime = "application/xz", run = "ouch" },
    { mime = "application/x-tar", run = "ouch" },
    { mime = "application/x-bzip", run = "ouch" },
    { mime = "application/x-bzip2", run = "ouch" },
    { mime = "application/x-7z-compressed", run = "ouch" },
    { mime = "application/x-rar", run = "ouch" },
]
