# TLP config — ThinkPad X1 Extreme Gen 1 (i7-8750H, hybrid Intel UHD 630 + GTX 1050 Ti)
# Drop-in override. Only keys set here differ from TLP defaults (/etc/tlp.conf).
#
# INSTALL (system-level — TLP reads /etc/tlp.d/*.conf, NOT the home repo):
#   sudo pacman -S tlp
#   sudo ln -s ~/dotfiles/.config/tlp/01-thinkpad-x1e.conf /etc/tlp.d/01-thinkpad-x1e.conf
#   sudo systemctl enable --now tlp.service
#   # If power-profiles-daemon is installed it conflicts with TLP — mask it:
#   sudo systemctl mask power-profiles-daemon.service
# VERIFY:  sudo tlp-stat -s   (status)   /   sudo tlp-stat -p   (cpu)   /   sudo tlp-stat -b (battery)

# ------------------------------------------------------------------ CPU
# intel_pstate only exposes powersave/performance; powersave is correct for both.
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Energy/perf hint. AC = responsive, BAT = favour power (biggest idle-draw win).
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

# Turbo: keep on AC, DISABLE on battery. This is a 45W chip that runs hot —
# capping turbo on battery cuts thermal spikes and draw with little felt slowdown.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# Firmware platform profile (thinkpad_acpi).
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

# ------------------------------------------------------------------ PCIe / bus
# ASPM powersupersave on battery — saves idle power on the PCIe fabric. Safe here.
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# Runtime PM for PCIe devices (lets the dGPU + controllers suspend when idle).
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto

# ------------------------------------------------------------------ Wifi / USB / audio
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
USB_AUTOSUSPEND=1
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1

# ------------------------------------------------------------------ Battery charge thresholds
# Current battery is ~39% health / 2005 cycles (EOL) — leave STOP=100 for max usable
# runtime NOW. AFTER you fit a new cell, switch STOP to 80 and START to 75 for longevity.
START_CHARGE_THRESH_BAT0=0
STOP_CHARGE_THRESH_BAT0=100
# New-battery longevity preset (uncomment after replacement, comment the two lines above):
# START_CHARGE_THRESH_BAT0=75
# STOP_CHARGE_THRESH_BAT0=80
