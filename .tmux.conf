# ---------------------------------------------------------------------------
# Plugins (tpm)
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'catppuccin/tmux'

# catppuccin (mocha) — set before tpm loads the plugin
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_directory_text ' #{b:pane_current_path}'

# tmux-logging toggle off prefix+P (P is the sesh switcher) -> prefix+M-l
set -g @logging_key 'M-l'

# tpm + plugins live under XDG, not the default ~/.tmux/plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
run -b '~/.config/tmux/plugins/tpm/tpm'

# ---------------------------------------------------------------------------
# Prefix
# ---------------------------------------------------------------------------
unbind c-b
set -g prefix M-f
bind M-f send-prefix

# ---------------------------------------------------------------------------
# General options
# ---------------------------------------------------------------------------
setw -g mode-keys vi                 # vi keys in copy mode
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,foot:Tc"
set -g focus-events on               # nvim FocusGained/Lost (autoread, autosave)
set -sg escape-time 0
set -s extended-keys off   # foot CSI-u Esc breaks lazygit Esc in popups
set -g mouse on

# 1-indexed windows/panes, gap-free after a close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---------------------------------------------------------------------------
# Wayland clipboard (OSC52 + wl-copy)
# ---------------------------------------------------------------------------
set -g set-clipboard on
bind-key -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

# ---------------------------------------------------------------------------
# Keybinds
# ---------------------------------------------------------------------------
bind-key r source-file ~/.tmux.conf                                    # reload
bind-key m-f last-window                                               # last window

# Splits
bind-key v split-window -v
bind-key b split-window -h

# Move panes between windows
bind-key j command-prompt -p "join pane from:" "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:"   "join-pane -t '%%'"

# Workflow popups
bind-key -N "sesh project switcher" P run-shell "sesh-switch"
bind-key -N "lazygit popup"         g display-popup -E -w 90% -h 90% -d '#{pane_current_path}' 'lazygit'
bind-key -N "yazi -> sesh session"  Y display-popup -E -w 90% -h 90% 'sesh-yazi'

# Resize panes
bind-key -n C-down  resize-pane -D
bind-key -n C-up    resize-pane -U
bind-key -n C-left  resize-pane -L
bind-key -n C-right resize-pane -R

# ---------------------------------------------------------------------------
# Seamless C-hjkl nav across nvim splits + tmux panes (smart-splits.nvim)
# ---------------------------------------------------------------------------
# When the focused pane runs (n)vim/fzf, pass the key through to it; otherwise
# switch tmux panes. Inlined per-bind so tmux expands #{pane_tty} at keypress
# (a shared variable does not expand it, so the binds never registered).
bind-key -n C-h if-shell "ps -o state= -o comm= -t '#{pane_tty}' 2>/dev/null | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(-wrapped)?(diff)?$'" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "ps -o state= -o comm= -t '#{pane_tty}' 2>/dev/null | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(-wrapped)?(diff)?$'" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "ps -o state= -o comm= -t '#{pane_tty}' 2>/dev/null | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(-wrapped)?(diff)?$'" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "ps -o state= -o comm= -t '#{pane_tty}' 2>/dev/null | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(-wrapped)?(diff)?$'" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# ---------------------------------------------------------------------------
# Status bar — catppuccin modules, minimal (session left, cwd right)
# ---------------------------------------------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right ""
set -agF status-right "#{E:@catppuccin_status_directory}"

# Theme accents (mocha)
set -g pane-active-border-style "fg=#cba6f7"
set -g pane-border-style        "fg=#45475a"
set -g message-style            "bg=#313244,fg=#cdd6f4"
set -g mode-style               "bg=#585b70,fg=#cdd6f4"
